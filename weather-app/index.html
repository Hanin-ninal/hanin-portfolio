
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Check current weather, temperature, humidity and wind conditions around the world.">

    <title>Hanin's Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="brand-icon">☁️</div>
            <h1>Weather App</h1>
            <p class="subtitle">Discover the weather around you</p>
        </header>

        <!-- City Search -->
        <section class="search-section">

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search for a city..."
                    autocomplete="off"
                    aria-label="City name"
                >

                <button id="searchButton" type="button">
                    Search
                </button>
            </div>

            <button id="locationButton" type="button">
                📍 Use My Location
            </button>

        </section>

        <!-- Weather Information -->
        <section class="weather-info">

            <div class="location-heading">
                <h2 id="cityName">Reyhanli, Türkiye</h2>
                <p id="lastUpdated">Waiting for weather data...</p>
            </div>

            <div class="main-weather">

                <div class="weather-icon" id="weatherIcon">
                    🌤️
                </div>

                <div class="temperature-area">
                    <h2 id="temperature">--°C</h2>
                    <p id="description">Loading weather...</p>
                    <p id="feelsLikeText">
                        Feels like <span id="feelsLike">--°C</span>
                    </p>
                </div>

            </div>

            <!-- Daily Temperatures -->
            <div class="temperature-range">

                <div class="range-item">
                    <span>↑</span>
                    <div>
                        <small>Maximum</small>
                        <strong id="maxTemp">--°C</strong>
                    </div>
                </div>

                <div class="range-item">
                    <span>↓</span>
                    <div>
                        <small>Minimum</small>
                        <strong id="minTemp">--°C</strong>
                    </div>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="details">

                <div class="detail-card">
                    <span class="detail-icon">💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span class="detail-icon">💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Weather data provided by Open-Meteo</p>
            <p>Designed & Built by Hanin Ninal Elasi</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
